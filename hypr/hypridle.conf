general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    # Esta línea es CLAVE: asegura que la pantalla se despierte bien
    after_sleep_cmd = hyprctl dispatch dpms on && hyprctl dispatch focuswindow ""
}

# 1. PRE-AVISO: Baja el brillo a los 2.5 min (Esto está perfecto)
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

# 2. BLOQUEO: A los 5 min (Mantenemos tu tiempo)
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 3. APAGAR PANTALLA: ¡Aquí estaba el lío! 
# Vamos a darle 1 minuto de margen después del bloqueo (6 min total)
# para que el sistema no se atore.
listener {
    timeout = 360                                 # Subimos de 330 a 360
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

