# Fuente y Símbolos (Tus ajustes originales)
font_family      RobotoMono Nerd Font
font_size        10.5
symbol_map U+E0B0-U+E0B3 RobotoMono Nerd Font

# --- EL CAMBIO MAESTRO: Sincronización con Neovim ---
# Cambiamos el fondo de Catppuccin por el de tu Neovim (#1e222a)
background  #121317
foreground  #dcdccc
selection_foreground    #1e222a
selection_background    #abb2bf

cursor                  #abb2bf
cursor_text_color       #1e222a

url_color               #61afef

# Colores de la terminal (Mantenemos la elegancia, pero ajustados al tono de Neovim)
# black
color0 #282c34
color8 #5c6370
# red
color1 #e06c75
color9 #e06c75
# green (Este es el verde que verás en tus comandos)
color2  #98c379
color10 #98c379
# yellow
color3  #e5c07b
color11 #e5c07b
# blue
color4  #61afef
color12 #61afef
# magenta
color5  #c678dd
color13 #c678dd
# cyan
color6  #56b6c2
color14 #56b6c2
# white
color7  #abb2bf
color15 #ffffff

# EFECTOS DE TRANSPARENCIA (Mantenemos tu toque increíble)
background_opacity 0.60
background_blur 15
